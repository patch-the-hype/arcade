<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play — Patch's Arcade</title>
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; frame-src 'self'; base-uri 'none'; form-action 'none'">
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="stylesheet" href="arcade.css">
</head>
<body class="play-body">
  <div class="bar">
    <a class="back" href="index.html#games">◂ ALL GAMES</a>
    <span class="ptitle" id="t">LOADING…</span>
    <span class="receipts" id="r"></span>
    <button class="fs" id="fsBtn" type="button" hidden>FULLSCREEN ⤢</button>
  </div>
  <div class="stage">
    <iframe id="frame" title="AI-built game" allow="fullscreen"></iframe>
    <div class="focus-hint" id="hint">
      <span class="big">CLICK TO PLAY</span>
      <span class="small" id="hintSub">Unedited AI output. Keyboard controls — arrows or WASD. Click to start.</span>
    </div>
  </div>
<script src="play.js"></script>
</body>
</html>
