<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NEON PONG</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a12;display:flex;align-items:center;justify-content:center;font-family:"Courier New",monospace;overflow:hidden}
  canvas{box-shadow:0 0 40px #0ff3,0 0 80px #f0f2;border:2px solid #0ff;border-radius:6px}
</style>
</head>
<body>
<canvas id="c" width="800" height="500"></canvas>
<script>
const cv = document.getElementById('c'), cx = cv.getContext('2d');
const W = cv.width, H = cv.height, PW = 12, PH = 90, BR = 8;
const L = {x: 30, y: H/2 - PH/2, s: 0}, R = {x: W - 30 - PW, y: H/2 - PH/2, s: 0};
const ball = {x: W/2, y: H/2, vx: 0, vy: 0};
let keys = {}, playing = false, rally = 0, glow = 0;

function reset(dir) {
  ball.x = W/2; ball.y = H/2;
  const speed = 5 + rally * 0.4;
  ball.vx = dir * speed * (Math.random() > 0.5 ? 1 : 0.85);
  ball.vy = (Math.random() * 2 - 1) * speed * 0.6;
}

function start() {
  if (playing) return;
  L.s = 0; R.s = 0; rally = 0;
  playing = true;
  reset(Math.random() > 0.5 ? 1 : -1);
}

function update() {
  const SPD = 7;
  if (keys['w']) L.y -= SPD;
  if (keys['s']) L.y += SPD;
  if (keys['ArrowUp']) R.y -= SPD;
  if (keys['ArrowDown']) R.y += SPD;
  L.y = Math.max(0, Math.min(H - PH, L.y));
  R.y = Math.max(0, Math.min(H - PH, R.y));

  if (!playing) return;

  ball.x += ball.vx; ball.y += ball.vy;
  if (ball.y - BR < 0 || ball.y + BR > H) { ball.vy = -ball.vy; ball.y = Math.max(BR, Math.min(H - BR, ball.y)); }

  // paddle bounce: angle depends on hit position
  if (ball.vx < 0 && ball.x - BR < L.x + PW && ball.x - BR > L.x - 10 &&
      ball.y > L.y - BR && ball.y < L.y + PH + BR) {
    rally++; ball.x = L.x + PW + BR;
    const rel = (ball.y - (L.y + PH/2)) / (PH/2);
    ball.vx = Math.abs(ball.vx) * 1.05 + 0.2;
    ball.vy = rel * Math.abs(ball.vx) * 0.8;
  }
  if (ball.vx > 0 && ball.x + BR > R.x && ball.x + BR < R.x + PW + 10 &&
      ball.y > R.y - BR && ball.y < R.y + PH + BR) {
    rally++; ball.x = R.x - BR;
    const rel = (ball.y - (R.y + PH/2)) / (PH/2);
    ball.vx = -Math.abs(ball.vx) * 1.05 - 0.2;
    ball.vy = rel * Math.abs(ball.vx) * 0.8;
  }

  // score
  if (ball.x < -BR) { R.s++; playing = false; }
  if (ball.x > W + BR) { L.s++; playing = false; }
}

function neonText(txt, x, y, size, color) {
  cx.font = `bold ${size}px "Courier New",monospace`;
  cx.textAlign = 'center';
  cx.shadowColor = color; cx.shadowBlur = 20;
  cx.fillStyle = color;
  cx.fillText(txt, x, y);
  cx.shadowBlur = 0;
}

function draw() {
  cx.fillStyle = '#0a0a12';
  cx.fillRect(0, 0, W, H);

  // center line
  cx.setLineDash([10, 14]);
  cx.strokeStyle = '#0ff4'; cx.lineWidth = 3;
  cx.beginPath(); cx.moveTo(W/2, 0); cx.lineTo(W/2, H); cx.stroke();
  cx.setLineDash([]);

  // ball trail glow
  glow = playing ? Math.min(1, glow + 0.05) : Math.max(0, glow - 0.1);
  cx.shadowColor = '#ff0'; cx.shadowBlur = 25;
  cx.fillStyle = '#ff0';
  cx.beginPath(); cx.arc(ball.x, ball.y, BR, 0, Math.PI * 2); cx.fill();
  cx.shadowBlur = 0;

  for (const [p, c] of [[L, '#0ff'], [R, '#f0f']]) {
    cx.shadowColor = c; cx.shadowBlur = 18;
    cx.fillStyle = c;
    cx.fillRect(p.x, p.y, PW, PH);
    cx.shadowBlur = 0;
  }

  neonText(L.s, W/2 - 80, 60, 48, '#0ff');
  neonText(R.s, W/2 + 80, 60, 48, '#f0f');
  if (rally > 0) neonText(`RALLY ${rally}  x${(5 + rally * 0.4).toFixed(1)}`, W/2, 100, 16, '#fff8');

  if (!playing) {
    neonText('NEON PONG', W/2, H/2 - 40, 56, '#0ff');
    neonText(L.s || R.s ? `POINT — ${L.s} : ${R.s}` : '', W/2, H/2 + 10, 20, '#f0f');
    neonText('PRESS ANY KEY TO START', W/2, H/2 + 60, 20, '#fff');
    neonText('W/S — LEFT    ↑/↓ — RIGHT', W/2, H/2 + 95, 15, '#888');
  }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();

addEventListener('keydown', e => {
  if (!['ArrowUp', 'ArrowDown'].includes(e.key)) e.preventDefault();
  keys[e.key] = true;
  start();
});
addEventListener('keyup', e => keys[e.key] = false);
</script>
</body>
</html>
