<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NEON PONG</title>
<style>
  html,body{margin:0;height:100%;background:#050508;display:flex;align-items:center;justify-content:center;overflow:hidden}
  canvas{background:#050508;box-shadow:0 0 60px #0ff3;border:1px solid #0ff4}
</style>
</head>
<body>
<canvas id="c" width="900" height="540"></canvas>
<script>
"use strict";
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const W = cv.width, H = cv.height;
const PW = 14, PH = 90, PADDLE_SPEED = 7;
const BASE_SPEED = 6, SPEEDUP = 1.06, MAX_SPEED = 16;

const state = {
  running: false,
  left:  { x: 24, y: H/2 - PH/2, score: 0 },
  right: { x: W-24-PW, y: H/2 - PH/2, score: 0 },
  ball:  { x: W/2, y: H/2, vx: 0, vy: 0, r: 9, speed: BASE_SPEED },
  keys:  {}
};

function serve(dir) {
  const b = state.ball;
  b.x = W/2; b.y = H/2; b.speed = BASE_SPEED;
  const angle = (Math.random() * 0.8 - 0.4); // -0.4..0.4 rad
  b.vx = Math.cos(angle) * b.speed * dir;
  b.vy = Math.sin(angle) * b.speed;
}

function reset() {
  state.left.y = state.right.y = H/2 - PH/2;
  state.left.score = state.right.score = 0;
  serve(Math.random() < 0.5 ? -1 : 1);
}

addEventListener("keydown", e => {
  state.keys[e.code] = true;
  if (!state.running) { reset(); state.running = true; }
  if (["ArrowUp","ArrowDown","Space"].includes(e.code)) e.preventDefault();
});
addEventListener("keyup", e => { state.keys[e.code] = false; });

function update() {
  const { left, right, ball, keys } = state;

  if (keys.KeyW) left.y -= PADDLE_SPEED;
  if (keys.KeyS) left.y += PADDLE_SPEED;
  if (keys.ArrowUp) right.y -= PADDLE_SPEED;
  if (keys.ArrowDown) right.y += PADDLE_SPEED;
  left.y = Math.max(0, Math.min(H - PH, left.y));
  right.y = Math.max(0, Math.min(H - PH, right.y));

  ball.x += ball.vx;
  ball.y += ball.vy;

  if (ball.y - ball.r < 0)      { ball.y = ball.r;     ball.vy *= -1; }
  if (ball.y + ball.r > H)      { ball.y = H - ball.r; ball.vy *= -1; }

  for (const p of [left, right]) {
    const facing = p === left ? ball.vx < 0 : ball.vx > 0;
    if (facing &&
        ball.x + ball.r > p.x && ball.x - ball.r < p.x + PW &&
        ball.y + ball.r > p.y && ball.y - ball.r < p.y + PH) {
      ball.speed = Math.min(ball.speed * SPEEDUP, MAX_SPEED);
      const hit = (ball.y - (p.y + PH/2)) / (PH/2);       // -1..1
      const angle = hit * (Math.PI / 3.2);                // max ~56 deg
      const dir = p === left ? 1 : -1;
      ball.vx = Math.cos(angle) * ball.speed * dir;
      ball.vy = Math.sin(angle) * ball.speed;
      ball.x = p === left ? p.x + PW + ball.r : p.x - ball.r;
    }
  }

  if (ball.x < -ball.r)      { right.score++; serve(-1); }
  else if (ball.x > W+ball.r){ left.score++;  serve(1);  }
}

function neon(fn, color, blur) {
  ctx.save();
  ctx.shadowColor = color; ctx.shadowBlur = blur;
  ctx.fillStyle = color;
  fn();
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // center line
  ctx.save();
  ctx.strokeStyle = "#0ff5"; ctx.setLineDash([10, 14]); ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke();
  ctx.restore();

  // paddles
  neon(() => ctx.fillRect(state.left.x, state.left.y, PW, PH), "#0ff", 18);
  neon(() => ctx.fillRect(state.right.x, state.right.y, PW, PH), "#f0f", 18);

  // ball
  neon(() => {
    ctx.beginPath();
    ctx.arc(state.ball.x, state.ball.y, state.ball.r, 0, Math.PI*2);
    ctx.fill();
  }, "#fff", 22);

  // scores
  ctx.save();
  ctx.font = "700 64px 'Courier New', monospace";
  ctx.textAlign = "center";
  ctx.shadowBlur = 24;
  ctx.shadowColor = "#0ff"; ctx.fillStyle = "#0ff";
  ctx.fillText(state.left.score, W/2 - 90, 80);
  ctx.shadowColor = "#f0f"; ctx.fillStyle = "#f0f";
  ctx.fillText(state.right.score, W/2 + 90, 80);
  ctx.restore();

  if (!state.running) {
    ctx.save();
    ctx.font = "700 42px 'Courier New', monospace";
    ctx.textAlign = "center";
    ctx.shadowColor = "#fff"; ctx.shadowBlur = 30; ctx.fillStyle = "#fff";
    ctx.fillText("NEON PONG", W/2, H/2 - 40);
    ctx.font = "20px 'Courier New', monospace";
    ctx.shadowBlur = 12;
    ctx.fillText("press any key to start", W/2, H/2 + 10);
    ctx.font = "16px 'Courier New', monospace";
    ctx.fillText("W / S  —  left paddle      ↑ / ↓  —  right paddle", W/2, H/2 + 50);
    ctx.restore();
  }
}

function frame() {
  if (state.running) update();
  draw();
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
