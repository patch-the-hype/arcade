<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NEON PONG</title>
<style>
  html,body{margin:0;height:100%;background:#05050d;display:flex;align-items:center;justify-content:center;overflow:hidden}
  canvas{box-shadow:0 0 40px #0ff8,0 0 80px #f0f8;border:1px solid #0ff3;border-radius:4px}
</style>
</head>
<body>
<canvas id="c" width="800" height="500"></canvas>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');
const W=cv.width,H=cv.height;
const PW=12,PH=90,PAD=24,PSPD=7;
const START_SPEED=5,MAX_SPEED=16,SPEEDUP=0.4;
const state={running:false,over:false,l:0,r:0};
const keys={};
const lp={x:PAD,y:H/2-PH/2},rp={x:W-PAD-PW,y:H/2-PH/2};
const ball={x:W/2,y:H/2,vx:0,vy:0,r:8,trail:[]};

function resetBall(dir){
  ball.x=W/2;ball.y=H/2;ball.trail=[];
  const ang=(Math.random()*0.6-0.3);
  ball.vx=dir*START_SPEED*Math.cos(ang);
  ball.vy=START_SPEED*Math.sin(ang);
}
function start(){state.running=true;state.over=false;state.l=0;state.r=0;lp.y=rp.y=H/2-PH/2;resetBall(Math.random()<0.5?1:-1);}
function speed(){return Math.hypot(ball.vx,ball.vy);}
function speedUp(){
  const s=Math.min(speed()+SPEEDUP,MAX_SPEED),a=Math.atan2(ball.vy,ball.vx);
  ball.vx=s*Math.cos(a);ball.vy=s*Math.sin(a);
}
function score(who){
  who==='l'?state.l++:state.r++;
  if(state.l>=11||state.r>=11){state.running=false;state.over=true;}
  else resetBall(who==='l'?1:-1);
}
function update(){
  if(keys['w'])lp.y-=PSPD;
  if(keys['s'])lp.y+=PSPD;
  if(keys['ArrowUp'])rp.y-=PSPD;
  if(keys['ArrowDown'])rp.y+=PSPD;
  lp.y=Math.max(0,Math.min(H-PH,lp.y));
  rp.y=Math.max(0,Math.min(H-PH,rp.y));

  ball.x+=ball.vx;ball.y+=ball.vy;
  ball.trail.push({x:ball.x,y:ball.y});
  if(ball.trail.length>12)ball.trail.shift();

  if(ball.y-ball.r<0){ball.y=ball.r;ball.vy=Math.abs(ball.vy);}
  if(ball.y+ball.r>H){ball.y=H-ball.r;ball.vy=-Math.abs(ball.vy);}

  // paddle collisions
  if(ball.vx<0&&ball.x-ball.r<lp.x+PW&&ball.x-ball.r>lp.x-10&&ball.y>lp.y-ball.r&&ball.y<lp.y+PH+ball.r){
    ball.x=lp.x+PW+ball.r;ball.vx=Math.abs(ball.vx);speedUp();
    ball.vy+=((ball.y-(lp.y+PH/2))/(PH/2))*2; // angle by hit position
  }
  if(ball.vx>0&&ball.x+ball.r>rp.x&&ball.x+ball.r<rp.x+PW+10&&ball.y>rp.y-ball.r&&ball.y<rp.y+PH+ball.r){
    ball.x=rp.x-ball.r;ball.vx=-Math.abs(ball.vx);speedUp();
    ball.vy+=((ball.y-(rp.y+PH/2))/(PH/2))*2;
  }
  if(ball.x<-30)score('r');
  if(ball.x>W+30)score('l');
}
function glowRect(px,py,w,h,color,blur){
  x.shadowColor=color;x.shadowBlur=blur;x.fillStyle=color;
  x.fillRect(px,py,w,h);x.shadowBlur=0;
}
function draw(){
  x.fillStyle='#05050d';x.fillRect(0,0,W,H);
  // center dashed line
  x.strokeStyle='#0ff4';x.setLineDash([10,14]);x.lineWidth=2;
  x.beginPath();x.moveTo(W/2,0);x.lineTo(W/2,H);x.stroke();x.setLineDash([]);
  // score
  x.font='bold 48px monospace';x.textAlign='center';
  x.shadowColor='#0ff';x.shadowBlur=20;x.fillStyle='#0ff';
  x.fillText(state.l,W/2-70,60);
  x.shadowColor='#f0f';x.shadowBlur=20;x.fillStyle='#f0f';
  x.fillText(state.r,W/2+70,60);
  x.shadowBlur=0;
  glowRect(lp.x,lp.y,PW,PH,'#0ff',18);
  glowRect(rp.x,rp.y,PW,PH,'#f0f',18);
  // ball trail
  ball.trail.forEach((t,i)=>{
    x.fillStyle='rgba(255,255,255,'+(i/ball.trail.length*0.25)+')';
    x.beginPath();x.arc(t.x,t.y,ball.r*(i/ball.trail.length),0,Math.PI*2);x.fill();
  });
  x.shadowColor='#fff';x.shadowBlur=25;x.fillStyle='#fff';
  x.beginPath();x.arc(ball.x,ball.y,ball.r,0,Math.PI*2);x.fill();x.shadowBlur=0;
  if(!state.running){
    x.font='bold 22px monospace';x.fillStyle='#fff';
    if(state.over){
      const msg=state.l>state.r?'LEFT WINS':'RIGHT WINS';
      x.shadowColor='#ff0';x.shadowBlur=25;x.fillStyle='#ff0';
      x.fillText(msg+'  '+state.l+'-'+state.r,W/2,H/2+60);x.shadowBlur=0;
    } else {
      x.fillStyle='#fff';
      x.fillText('PRESS ANY KEY TO START',W/2,H/2+60);
      x.font='14px monospace';x.fillStyle='#888';
      x.fillText('W/S — LEFT   |   ARROWS — RIGHT',W/2,H/2+90);
    }
  }
}
let last=0;
function loop(t){
  if(state.running)update();
  else if(!state.over){ball.x=W/2;ball.y=H/2+Math.sin(t/400)*30;} // idle bob
  draw();
  requestAnimationFrame(loop);
}
addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(!state.running)start();
  if(['ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();
});
addEventListener('keyup',e=>keys[e.key]=false);
requestAnimationFrame(loop);
</script>
</body>
</html>
