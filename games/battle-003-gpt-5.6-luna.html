<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Snake</title>
<style>
  :root { color-scheme: dark; --cyan:#55f6ff; --pink:#ff4fd8; --ink:#080b18; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; overflow:hidden;
    background:radial-gradient(circle at 50% 35%,#17214a 0,#080b18 55%,#03040a 100%);
    color:#dffcff; font:600 14px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace; }
  main { width:min(92vw,620px); }
  header { display:flex; align-items:end; justify-content:space-between; margin:0 2px 12px; }
  h1 { margin:0; color:var(--cyan); font-size:clamp(24px,6vw,38px); letter-spacing:.18em;
    text-shadow:0 0 8px #55f6ff,0 0 24px #168caa; }
  .score { color:#8ea3cc; text-align:right; letter-spacing:.1em; }
  .score b { display:block; color:var(--pink); font-size:24px; text-shadow:0 0 10px #ff4fd8; }
  .frame { position:relative; padding:10px; border:1px solid #2f5382; background:#070c1b;
    box-shadow:0 0 0 3px #0b1730,0 0 22px #115e87, inset 0 0 26px #071a34; }
  canvas { display:block; width:100%; aspect-ratio:1; background:#060918; image-rendering:pixelated; }
  .overlay { position:absolute; inset:10px; display:grid; place-items:center; background:#060918cc; text-align:center;
    opacity:0; pointer-events:none; transition:opacity .2s; }
  .overlay.show { opacity:1; pointer-events:auto; }
  .panel { padding:24px 28px; border:1px solid #37618d; background:#0a1025e8; box-shadow:0 0 28px #0c7c9c66; }
  .panel h2 { margin:0 0 8px; color:var(--pink); font-size:26px; letter-spacing:.15em; text-shadow:0 0 10px var(--pink); }
  .panel p { margin:0 0 18px; color:#adbfdf; }
  button { border:1px solid var(--cyan); padding:10px 18px; color:var(--cyan); background:#082039;
    font:inherit; cursor:pointer; text-transform:uppercase; letter-spacing:.12em; box-shadow:0 0 12px #55f6ff55; }
  button:hover,button:focus-visible { background:#12365a; outline:2px solid var(--pink); }
  footer { display:flex; justify-content:space-between; margin:12px 2px 0; color:#657da8; font-size:11px; letter-spacing:.06em; }
  @media (max-width:450px) { footer { display:block; line-height:1.8; } footer span { display:block; } }
</style>
</head>
<body>
<main>
  <header><h1>SNAKE//NEON</h1><div class="score">SCORE<b id="score">0000</b></div></header>
  <div class="frame">
    <canvas id="game" aria-label="Snake game"></canvas>
    <div id="overlay" class="overlay show"><div class="panel"><h2 id="title">READY?</h2><p id="message">Arrow keys or WASD to move</p><button id="start">Start game</button></div></div>
  </div>
  <footer><span>MOVE: ARROWS / WASD</span><span>WALLS ARE DEADLY</span><span>FPS: 60</span></footer>
</main>
<script>
(() => {
  const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score'), overlay = document.getElementById('overlay');
  const title = document.getElementById('title'), message = document.getElementById('message'), start = document.getElementById('start');
  const N = 24, stepTime = 105; let cell, snake, food, dir, nextDir, score, running = false, last = 0, accumulator = 0;
  const dirs = { ArrowUp:[0,-1], w:[0,-1], W:[0,-1], ArrowDown:[0,1], s:[0,1], S:[0,1], ArrowLeft:[-1,0], a:[-1,0], A:[-1,0], ArrowRight:[1,0], d:[1,0], D:[1,0] };
  function resize() { const dpr = devicePixelRatio || 1, size = canvas.clientWidth; canvas.width = size*dpr; canvas.height = size*dpr; cell = size/N; ctx.setTransform(dpr,0,0,dpr,0,0); draw(); }
  function reset() { snake = [{x:12,y:12},{x:11,y:12},{x:10,y:12}]; dir = [1,0]; nextDir = dir; score = 0; scoreEl.textContent = '0000'; placeFood(); }
  function placeFood() { do { food = {x:Math.floor(Math.random()*N), y:Math.floor(Math.random()*N)}; } while (snake.some(p => p.x === food.x && p.y === food.y)); }
  function begin() { reset(); running = true; accumulator = 0; last = performance.now(); overlay.classList.remove('show'); requestAnimationFrame(loop); }
  function end() { running = false; title.textContent = 'GAME OVER'; message.textContent = `Final score: ${score}  //  Press any key to restart`; start.textContent = 'Restart'; overlay.classList.add('show'); }
  function tick() {
    dir = nextDir; const head = {x:snake[0].x+dir[0], y:snake[0].y+dir[1]};
    if (head.x < 0 || head.x >= N || head.y < 0 || head.y >= N || snake.some(p => p.x === head.x && p.y === head.y)) return end();
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) { score += 10; scoreEl.textContent = String(score).padStart(4,'0'); placeFood(); } else snake.pop();
  }
  function loop(now) { if (!running) return; accumulator += Math.min(now-last,100); last = now; while (accumulator >= stepTime) { tick(); accumulator -= stepTime; if (!running) return; } draw(); requestAnimationFrame(loop); }
  function draw() {
    if (!cell) return; ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight); ctx.fillStyle = '#060918'; ctx.fillRect(0,0,canvas.clientWidth,canvas.clientHeight);
    ctx.strokeStyle = '#102342'; ctx.lineWidth = 1; for (let i=1;i<N;i++) { const p=i*cell+.5; ctx.beginPath(); ctx.moveTo(p,0); ctx.lineTo(p,N*cell); ctx.moveTo(0,p); ctx.lineTo(N*cell,p); ctx.stroke(); }
    if (food) { ctx.shadowBlur=18; ctx.shadowColor='#ff4fd8'; ctx.fillStyle='#ff4fd8'; ctx.beginPath(); ctx.arc((food.x+.5)*cell,(food.y+.5)*cell,cell*.27,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0; }
    snake?.forEach((p,i) => { const pad=cell*.1; ctx.fillStyle=i?'#23b9d0':'#a5ffff'; ctx.shadowBlur=i?10:18; ctx.shadowColor=i?'#23b9d0':'#bfffff'; ctx.fillRect(p.x*cell+pad,p.y*cell+pad,cell-pad*2,cell-pad*2); }); ctx.shadowBlur=0;
  }
  function key(e) { const proposed = dirs[e.key]; if (proposed) { e.preventDefault(); if (!running) begin(); else if (proposed[0] !== -dir[0] || proposed[1] !== -dir[1]) nextDir = proposed; } }
  start.addEventListener('click', begin); addEventListener('keydown', key); addEventListener('resize', resize); resize();
})();
</script>
</body>
</html>
