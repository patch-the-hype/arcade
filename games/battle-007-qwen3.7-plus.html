<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NEON BREAKOUT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a12;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Courier New',monospace}
canvas{display:block;border:2px solid #0ff;box-shadow:0 0 20px #0ff,inset 0 0 20px rgba(0,255,255,0.1)}
</style>
</head>
<body>
<canvas id="c" width="800" height="600"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=800,H=600;
const COLORS=['#ff0055','#ff6600','#ffff00','#00ff66','#00ccff','#cc00ff'];
let paddle={w:100,h:14,x:350,y:570,speed:7};
let ball={x:400,y:556,r:8,dx:4,dy:-4,baseSpeed:5};
let bricks=[],score=0,lives=3,started=false,gameOver=false,won=false;
let keys={},totalBricks=0,brokenBricks=0;

function initBricks(){
  bricks=[];
  const rows=6,cols=10,bw=70,bh=22,pad=6,offX=35,offY=50;
  for(let r=0;r<rows;r++)for(let cl=0;cl<cols;cl++){
    bricks.push({x:offX+cl*(bw+pad),y:offY+r*(bh+pad),w:bw,h:bh,alive:true,color:COLORS[r],row:r});
  }
  totalBricks=bricks.length;brokenBricks=0;
}

function resetBall(){
  ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-1;
  const angle=(Math.random()*0.6-0.3)+Math.PI*1.5;
  const speed=ball.baseSpeed+brokenBricks*0.08;
  ball.dx=Math.cos(angle)*speed;ball.dy=Math.sin(angle)*speed;
  started=false;
}

function startGame(){
  score=0;lives=3;gameOver=false;won=false;
  paddle.x=W/2-paddle.w/2;
  initBricks();resetBall();
}

function update(){
  if(gameOver)return;
  if(keys['ArrowLeft']||keys['KeyA'])paddle.x-=paddle.speed;
  if(keys['ArrowRight']||keys['KeyD'])paddle.x+=paddle.speed;
  paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));

  if(!started){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-1;return;}

  ball.x+=ball.dx;ball.y+=ball.dy;
  if(ball.x-ball.r<0||ball.x+ball.r>W)ball.dx*=-1;
  if(ball.y-ball.r<0)ball.dy*=-1;

  if(ball.y+ball.r>H){
    lives--;
    if(lives<=0){gameOver=true;}else{resetBall();}
    return;
  }

  if(ball.dy>0&&ball.y+ball.r>=paddle.y&&ball.y+ball.r<=paddle.y+paddle.h
    &&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w){
    const hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);
    const angle=hit*(Math.PI/3);
    const speed=Math.sqrt(ball.dx*ball.dx+ball.dy*ball.dy);
    ball.dx=Math.sin(angle)*speed;
    ball.dy=-Math.cos(angle)*speed;
    ball.y=paddle.y-ball.r-1;
  }

  for(const b of bricks){
    if(!b.alive)continue;
    if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){
      b.alive=false;brokenBricks++;
      score+=(6-b.row)*10;
      const speed=ball.baseSpeed+brokenBricks*0.08;
      const mag=Math.sqrt(ball.dx*ball.dx+ball.dy*ball.dy);
      ball.dx=(ball.dx/mag)*speed;ball.dy=(ball.dy/mag)*speed;
      const overlapX=Math.min(ball.x+ball.r-b.x,b.x+b.w-(ball.x-ball.r));
      const overlapY=Math.min(ball.y+ball.r-b.y,b.y+b.h-(ball.y-ball.r));
      if(overlapX<overlapY)ball.dx*=-1;else ball.dy*=-1;
      if(brokenBricks>=totalBricks){gameOver=true;won=true;}
      break;
    }
  }
}

function drawNeon(text,x,y,color,size){
  ctx.save();ctx.font=`bold ${size}px Courier New`;ctx.textAlign='center';
  ctx.shadowColor=color;ctx.shadowBlur=15;ctx.fillStyle=color;
  ctx.fillText(text,x,y);ctx.shadowBlur=30;ctx.fillText(text,x,y);ctx.restore();
}

function draw(){
  ctx.fillStyle='#0a0a12';ctx.fillRect(0,0,W,H);

  ctx.save();ctx.shadowColor='#0ff';ctx.shadowBlur=12;
  ctx.fillStyle='#0ff';ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);ctx.restore();

  ctx.save();ctx.shadowColor='#fff';ctx.shadowBlur=15;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.restore();

  for(const b of bricks){
    if(!b.alive)continue;
    ctx.save();ctx.shadowColor=b.color;ctx.shadowBlur=8;
    ctx.fillStyle=b.color;ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.strokeRect(b.x,b.y,b.w,b.h);ctx.restore();
  }

  ctx.save();ctx.shadowColor='#0f0';ctx.shadowBlur=6;ctx.fillStyle='#0f0';
  ctx.font='bold 18px Courier New';ctx.textAlign='left';
  ctx.fillText(`SCORE: ${score}`,20,28);ctx.textAlign='right';
  ctx.fillText(`LIVES: ${lives}`,W-20,28);ctx.restore();

  if(!started&&!gameOver){
    drawNeon('PRESS SPACE TO START',W/2,H/2,'#0ff',28);
  }
  if(gameOver){
    const msg=won?'YOU WIN!':'GAME OVER';
    const col=won?'#0f0':'#f00';
    drawNeon(msg,W/2,H/2-20,col,40);
    drawNeon(`FINAL SCORE: ${score}`,W/2,H/2+30,'#ff0',22);
    drawNeon('PRESS SPACE TO RESTART',W/2,H/2+70,'#0ff',18);
  }
}

function loop(){update();draw();requestAnimationFrame(loop);}

document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='Space'){
    if(gameOver)startGame();
    else if(!started)started=true;
  }
});
document.addEventListener('keyup',e=>{keys[e.code]=false;});
c.addEventListener('mousemove',e=>{
  const rect=c.getBoundingClientRect();
  paddle.x=((e.clientX-rect.left)/rect.width)*W-paddle.w/2;
  paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));
});

startGame();loop();
</script>
</body>
</html>
