<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NEON INVADERS</title>
<style>
html,body{margin:0;height:100%;background:#030308;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:ui-monospace,monospace;color:#0ff}
h1{margin:0 0 8px;letter-spacing:.35em;font-size:18px;text-shadow:0 0 14px #0ff,0 0 28px #f0f}
canvas{background:#070714;box-shadow:0 0 28px #0ff5,0 0 80px #f0f3;border:2px solid #0ff7}
p{margin:10px 0 0;opacity:.55;font-size:12px;letter-spacing:.12em}
</style>
</head>
<body>
<h1>NEON INVADERS</h1>
<canvas id="g" width="480" height="640"></canvas>
<p>← → MOVE · SPACE FIRE · R RESTART</p>
<script>
const C=document.getElementById('g'),X=C.getContext('2d'),W=480,H=640;
const COL=['#f0f','#0ff','#ff0'];
const stars=Array.from({length:60},()=>({x:Math.random()*W,y:Math.random()*H,z:.4+Math.random()}));
let keys={},S,last=0;
function reset(){
  S={px:W/2-18,lives:3,score:0,over:0,win:0,dir:1,cool:0,acool:0,hit:0,
     pb:[],ab:[],al:[]};
  for(let r=0;r<5;r++)for(let c=0;c<8;c++)
    S.al.push({x:36+c*52,y:56+r*38,ok:1,t:r<2?0:r<4?1:2});
}
function live(){return S.al.filter(a=>a.ok)}
function hit(b,x,y,w,h){return b.x>x&&b.x<x+w&&b.y>y&&b.y<y+h}
function step(ts){
  requestAnimationFrame(step);
  const dt=Math.min(32,ts-last||16);last=ts;
  if(S.over){draw();return}
  const n=live();
  if(keys.ArrowLeft)S.px=Math.max(6,S.px-.38*dt);
  if(keys.ArrowRight)S.px=Math.min(W-42,S.px+.38*dt);
  S.cool-=dt;S.acool-=dt;S.hit-=dt;
  if(keys[' ']&&S.cool<=0){S.pb.push({x:S.px+17,y:H-56});S.cool=320}
  S.pb=S.pb.filter(b=>(b.y-=.72*dt)>0);
  S.ab=S.ab.filter(b=>(b.y+=.42*dt)<H);
  const spd=(55+(40-n.length)*9)*S.dir*dt/1000;
  let edge=0;
  for(const a of n){a.x+=spd;if(a.x<8||a.x>W-36)edge=1}
  if(edge){S.dir*=-1;for(const a of n){a.y+=18;a.x+=S.dir*10}}
  for(const b of S.pb)for(const a of n)
    if(hit(b,a.x,a.y,28,22)){a.ok=0;b.y=-9;S.score+=(3-a.t)*20}
  if(n.length&&S.acool<=0){
    const a=n[(Math.random()*n.length)|0];
    S.ab.push({x:a.x+12,y:a.y+22});S.acool=900-n.length*12;
  }
  if(S.hit<=0)for(const b of S.ab)
    if(hit(b,S.px,H-50,36,22)){b.y=H+9;S.lives--;S.hit=900;if(S.lives<=0)S.over=1}
  if(n.some(a=>a.y>H-78))S.over=1;
  if(!n.length){S.win=1;S.over=1}
  draw();
}
function glow(c){X.fillStyle=X.shadowColor=c;X.shadowBlur=12}
function draw(){
  X.shadowBlur=0;X.fillStyle='#070714';X.fillRect(0,0,W,H);
  for(const s of stars){X.globalAlpha=s.z*.5;X.fillStyle='#8ff';X.fillRect(s.x,s.y,1,1)}
  X.globalAlpha=1;
  glow('#0ff');X.font='15px monospace';
  X.fillText('SCORE '+S.score,12,22);X.fillText('LIVES '+S.lives,W-96,22);
  X.fillRect(0,H-18,W,2);
  glow('#0ff');X.fillRect(S.px,H-42,36,12);X.fillRect(S.px+14,H-50,8,8);
  for(const a of S.al)if(a.ok){
    glow(COL[a.t]);X.fillRect(a.x+6,a.y,16,4);X.fillRect(a.x,a.y+4,28,12);
    X.fillRect(a.x+4,a.y+16,6,6);X.fillRect(a.x+18,a.y+16,6,6);
  }
  glow('#ff0');for(const b of S.pb)X.fillRect(b.x,b.y,3,12);
  glow('#f44');for(const b of S.ab)X.fillRect(b.x,b.y,3,12);
  if(S.over){
    X.shadowBlur=0;X.fillStyle='rgba(0,0,8,.72)';X.fillRect(0,0,W,H);
    glow(S.win?'#0f8':'#f46');X.font='36px monospace';X.textAlign='center';
    X.fillText(S.win?'YOU WIN':'GAME OVER',W/2,H/2-8);
    glow('#0ff');X.font='14px monospace';X.fillText('PRESS R TO RESTART',W/2,H/2+28);
    X.textAlign='left';
  }
  X.shadowBlur=0;
}
addEventListener('keydown',e=>{
  keys[e.key]=1;
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'||e.key===' ')e.preventDefault();
  if(e.key==='r'||e.key==='R')reset();
});
addEventListener('keyup',e=>keys[e.key]=0);
reset();requestAnimationFrame(step);
</script>
</body>
</html>
