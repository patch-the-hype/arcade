<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NEON MAZE</title>
<style>
  body { margin:0; background:#05010d; display:flex; flex-direction:column; align-items:center;
         justify-content:center; height:100vh; font-family:'Courier New',monospace; color:#0ff; }
  #hud { display:flex; gap:2em; margin-bottom:10px; font-size:18px; letter-spacing:2px;
         text-shadow:0 0 8px #0ff; }
  canvas { border:2px solid #f0f; box-shadow:0 0 20px #f0f, 0 0 40px #f0f inset; background:#05010d; }
  #msg { margin-top:10px; font-size:20px; letter-spacing:3px; min-height:28px;
         text-shadow:0 0 10px #0f0; color:#0f0; }
</style>
</head>
<body>
<div id="hud">
  <span id="level">LEVEL 1</span>
  <span id="moves">MOVES 0</span>
  <span id="time">TIME 0.0s</span>
</div>
<canvas id="cv" width="600" height="600"></canvas>
<div id="msg">ARROW KEYS TO MOVE</div>
<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const hud = { level:document.getElementById('level'), moves:document.getElementById('moves'),
              time:document.getElementById('time'), msg:document.getElementById('msg') };
const N = 600; // canvas size

let cols, rows, cell, grid, player, goal, moves, startT, timerOn, level, won;

function newMaze(c, r) {
  // each cell: [top,right,bottom,left] walls, 1=wall
  const g = Array.from({length:r*c}, () => [1,1,1,1]);
  const seen = new Uint8Array(r*c);
  const stack = [0]; seen[0] = 1;
  const DIRS = [[0,-1,0,2],[1,0,1,3],[0,1,2,0],[-1,0,3,1]]; // dx,dy,wall,opposite
  while (stack.length) {
    const cur = stack[stack.length-1], cx = cur%c, cy = (cur/c)|0;
    const opts = DIRS.map((d,i) => {
      const nx = cx+d[0], ny = cy+d[1];
      return (nx>=0 && nx<c && ny>=0 && ny<r && !seen[ny*c+nx]) ? i : -1;
    }).filter(i => i>=0);
    if (!opts.length) { stack.pop(); continue; }
    const d = DIRS[opts[Math.random()*opts.length|0]];
    const nx = cx+d[0], ny = cy+d[1], next = ny*c+nx;
    g[cur][d[2]] = 0; g[next][d[3]] = 0;
    seen[next] = 1; stack.push(next);
  }
  return g;
}

function startLevel(lv) {
  cols = rows = 7 + lv*2;               // 9,11,13... bigger every level
  cell = N / cols;
  grid = newMaze(cols, rows);
  player = {x:0, y:0};
  goal = {x:cols-1, y:rows-1};
  moves = 0; startT = 0; timerOn = false; won = false;
  hud.level.textContent = 'LEVEL ' + lv;
  hud.moves.textContent = 'MOVES 0';
  hud.time.textContent = 'TIME 0.0s';
  hud.msg.textContent = 'ARROW KEYS TO MOVE';
  draw();
}

function neon(color, w) {
  ctx.strokeStyle = color; ctx.lineWidth = w;
  ctx.shadowColor = color; ctx.shadowBlur = 12;
}
function rect(x, y, w, h, color) {
  ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 18;
  ctx.fillRect(x, y, w, h);
  ctx.shadowBlur = 0;
}

function draw() {
  ctx.fillStyle = '#05010d'; ctx.fillRect(0, 0, N, N);
  // goal
  rect(goal.x*cell+cell*0.3, goal.y*cell+cell*0.3, cell*0.4, cell*0.4, '#0f0');
  // player
  ctx.beginPath();
  ctx.arc(player.x*cell+cell/2, player.y*cell+cell/2, cell*0.3, 0, 7);
  ctx.fillStyle = '#0ff'; ctx.shadowColor = '#0ff'; ctx.shadowBlur = 20; ctx.fill();
  ctx.shadowBlur = 0;
  // walls
  neon('#f0f', 2);
  ctx.beginPath();
  for (let y=0; y<rows; y++) for (let x=0; x<cols; x++) {
    const w = grid[y*cols+x], px = x*cell, py = y*cell;
    if (w[0]) { ctx.moveTo(px, py); ctx.lineTo(px+cell, py); }
    if (w[3]) { ctx.moveTo(px, py); ctx.lineTo(px, py+cell); }
    if (x===cols-1 && w[1]) { ctx.moveTo(px+cell, py); ctx.lineTo(px+cell, py+cell); }
    if (y===rows-1 && w[2]) { ctx.moveTo(px, py+cell); ctx.lineTo(px+cell, py+cell); }
  }
  ctx.stroke();
  ctx.shadowBlur = 0;
}

function tick() {
  if (timerOn) hud.time.textContent = 'TIME ' + ((performance.now()-startT)/1000).toFixed(1) + 's';
  requestAnimationFrame(tick);
}

document.addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
  if (won) { if (e.key==='Enter' || e.key.startsWith('Arrow')) startLevel(++level); return; }
  const w = grid[player.y*cols+player.x];
  let dx=0, dy=0;
  if (e.key==='ArrowUp'    && !w[0]) dy=-1;
  if (e.key==='ArrowDown'  && !w[2]) dy= 1;
  if (e.key==='ArrowLeft'  && !w[3]) dx=-1;
  if (e.key==='ArrowRight' && !w[1]) dx= 1;
  if (dx||dy) {
    if (!timerOn) { timerOn = true; startT = performance.now(); }
    player.x += dx; player.y += dy;
    moves++;
    hud.moves.textContent = 'MOVES ' + moves;
    if (player.x===goal.x && player.y===goal.y) {
      won = true; timerOn = false;
      hud.msg.textContent = 'LEVEL ' + level + ' CLEAR! MOVES ' + moves +
        ' TIME ' + ((performance.now()-startT)/1000).toFixed(1) + 's — PRESS ANY KEY';
    }
    draw();
  }
});

level = 1;
startLevel(level);
tick();
</script>
</body>
</html>
