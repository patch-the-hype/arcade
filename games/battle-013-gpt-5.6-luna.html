<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Breakout</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #050611; color: #e9f7ff; font: 600 16px system-ui, sans-serif; overflow: hidden; }
  main { width: min(94vw, 860px); text-align: center; }
  header { display: flex; justify-content: space-between; align-items: center; margin: 0 4px 10px; text-transform: uppercase; letter-spacing: .12em; font-size: clamp(11px, 2vw, 14px); color: #7cecff; }
  h1 { margin: 0; font-size: clamp(18px, 4vw, 28px); letter-spacing: .2em; color: #ff4fcb; text-shadow: 0 0 12px #ff4fcb; }
  #hud { display: flex; gap: 16px; }
  canvas { display: block; width: 100%; aspect-ratio: 4 / 3; border: 2px solid #263b72; border-radius: 8px; background: #090d20; box-shadow: 0 0 18px #172a70, inset 0 0 30px #101a44; touch-action: none; }
  footer { margin-top: 10px; color: #7785b7; font-size: 12px; letter-spacing: .08em; }
</style>
</head>
<body>
<main>
  <header><h1>NEON BREAKOUT</h1><div id="hud">SCORE <b id="score">0</b> · LIVES <b id="lives">3</b></div></header>
  <canvas id="game" width="800" height="600" aria-label="Playable Breakout game"></canvas>
  <footer>ARROWS / A D TO MOVE · PRESS ANY KEY TO LAUNCH</footer>
</main>
<script>
const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score'), livesEl = document.getElementById('lives');
const W = canvas.width, H = canvas.height, paddle = { x: W / 2 - 58, y: H - 38, w: 116, h: 12, speed: 8 };
const colors = ['#ff43c7', '#ff7543', '#ffe94a', '#5cff86', '#42ddff', '#a86cff'];
let ball, bricks, score = 0, lives = 3, running = false, over = false, left = false, right = false, last = 0;

function resetBall() { ball = { x: W / 2, y: H - 58, r: 8, vx: 0, vy: 0, speed: 5.4 }; running = false; }
function newGame() {
  score = 0; lives = 3; over = false; paddle.x = W / 2 - paddle.w / 2;
  bricks = []; const cols = 10, rows = 6, gap = 7, bw = 68, bh = 22, startX = (W - (cols * bw + (cols - 1) * gap)) / 2;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) bricks.push({ x: startX + c * (bw + gap), y: 74 + r * (bh + gap), w: bw, h: bh, color: colors[r], alive: true });
  resetBall(); updateHud();
}
function launch() { if (over) newGame(); if (running) return; const angle = (Math.random() * .9 + 1.12) * (Math.random() < .5 ? -1 : 1); ball.vx = Math.sin(angle) * ball.speed; ball.vy = -Math.cos(angle) * ball.speed; running = true; }
function updateHud() { scoreEl.textContent = score; livesEl.textContent = lives; }
function hit(a, b) { return a.x + a.r > b.x && a.x - a.r < b.x + b.w && a.y + a.r > b.y && a.y - a.r < b.y + b.h; }
function update(dt) {
  if (left) paddle.x -= paddle.speed * dt * 60; if (right) paddle.x += paddle.speed * dt * 60;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x)); if (!running) return;
  ball.x += ball.vx * dt * 60; ball.y += ball.vy * dt * 60;
  if (ball.x < ball.r || ball.x > W - ball.r) { ball.x = Math.max(ball.r, Math.min(W - ball.r, ball.x)); ball.vx *= -1; }
  if (ball.y < ball.r) { ball.y = ball.r; ball.vy *= -1; }
  if (ball.vy > 0 && hit(ball, paddle)) { const offset = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); const speed = Math.hypot(ball.vx, ball.vy); const angle = offset * 1.05; ball.vx = Math.sin(angle) * speed; ball.vy = -Math.cos(angle) * speed; ball.y = paddle.y - ball.r; }
  for (const b of bricks) if (b.alive && hit(ball, b)) { b.alive = false; score += 10; const overlapX = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r)); const overlapY = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r)); if (overlapX < overlapY) ball.vx *= -1; else ball.vy *= -1; ball.vx *= 1.012; ball.vy *= 1.012; updateHud(); break; }
  if (ball.y - ball.r > H) { lives--; updateHud(); if (lives < 1) { over = true; running = false; } else resetBall(); }
  if (bricks.every(b => !b.alive)) { over = true; running = false; }
}
function draw() {
  ctx.fillStyle = '#090d20'; ctx.fillRect(0, 0, W, H); ctx.strokeStyle = 'rgba(76,132,255,.08)'; ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); } for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  for (const b of bricks) if (b.alive) { ctx.shadowBlur = 14; ctx.shadowColor = b.color; ctx.fillStyle = b.color; ctx.fillRect(b.x, b.y, b.w, b.h); ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.fillRect(b.x + 3, b.y + 3, b.w - 6, 3); }
  ctx.shadowBlur = 18; ctx.shadowColor = '#42ddff'; ctx.fillStyle = '#42ddff'; ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h); ctx.shadowBlur = 0;
  ctx.shadowBlur = 20; ctx.shadowColor = '#fff'; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
  if (!running || over) { ctx.fillStyle = 'rgba(5,6,17,.62)'; ctx.fillRect(0, 0, W, H); ctx.textAlign = 'center'; ctx.shadowBlur = 18; ctx.shadowColor = over && lives ? '#5cff86' : '#ff43c7'; ctx.fillStyle = over && lives ? '#5cff86' : '#ff43c7'; ctx.font = 'bold 38px system-ui'; ctx.fillText(over ? (lives ? 'GRID CLEARED!' : 'GAME OVER') : 'PRESS ANY KEY', W / 2, H / 2 - 8); ctx.shadowBlur = 0; ctx.fillStyle = '#b7c7ff'; ctx.font = '16px system-ui'; ctx.fillText(over ? 'PRESS ENTER TO RESTART' : 'ARROWS OR A / D TO MOVE', W / 2, H / 2 + 28); }
}
function frame(now) { const dt = Math.min((now - last) / 1000 || 0, .025); last = now; update(dt); draw(); requestAnimationFrame(frame); }
function key(e, down) { if (['ArrowLeft', 'a', 'A'].includes(e.key)) left = down; if (['ArrowRight', 'd', 'D'].includes(e.key)) right = down; if (down && (e.key === 'Enter' || !running && !over)) launch(); if (['ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault(); }
addEventListener('keydown', e => key(e, true)); addEventListener('keyup', e => key(e, false));
canvas.addEventListener('mousemove', e => { const r = canvas.getBoundingClientRect(); paddle.x = (e.clientX - r.left) * W / r.width - paddle.w / 2; });
canvas.addEventListener('pointerdown', launch);
newGame(); requestAnimationFrame(frame);
</script>
</body>
</html>
