<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }
  #wrap {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  #score {
    color: #0ff;
    font-size: 22px;
    letter-spacing: 3px;
    text-shadow: 0 0 8px #0ff, 0 0 20px #0ff;
  }
  canvas {
    border: 2px solid #0ff;
    box-shadow: 0 0 15px #0ff, inset 0 0 15px rgba(0,255,255,0.05);
    background: #0a0a12;
    display: block;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 16px;
    pointer-events: none;
  }
  #overlay h1 {
    color: #f0f;
    font-size: 36px;
    letter-spacing: 4px;
    text-shadow: 0 0 10px #f0f, 0 0 30px #f0f;
  }
  #overlay p {
    color: #0ff;
    font-size: 16px;
    letter-spacing: 2px;
    text-shadow: 0 0 6px #0ff;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="score">SCORE: 0</div>
  <canvas id="c" width="400" height="400"></canvas>
  <div id="overlay">
    <h1 id="title">SNAKE</h1>
    <p id="prompt">PRESS ANY KEY TO START</p>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const overlay = document.getElementById('overlay');
  const titleEl = document.getElementById('title');
  const promptEl = document.getElementById('prompt');

  const CELL = 20;
  const COLS = canvas.width / CELL;
  const ROWS = canvas.height / CELL;
  const TICK_MS = 100;

  let snake, dir, nextDir, food, score, alive, started, lastTick;

  function reset() {
    const midX = Math.floor(COLS / 2);
    const midY = Math.floor(ROWS / 2);
    snake = [{x: midX, y: midY}, {x: midX - 1, y: midY}, {x: midX - 2, y: midY}];
    dir = {x: 1, y: 0};
    nextDir = {x: 1, y: 0};
    score = 0;
    alive = true;
    started = false;
    lastTick = 0;
    spawnFood();
    scoreEl.textContent = 'SCORE: 0';
    titleEl.textContent = 'SNAKE';
    promptEl.textContent = 'PRESS ANY KEY TO START';
    overlay.style.display = 'flex';
  }

  function spawnFood() {
    const occupied = new Set(snake.map(s => `${s.x},${s.y}`));
    let pos;
    do {
      pos = {x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS)};
    } while (occupied.has(`${pos.x},${pos.y}`));
    food = pos;
  }

  const KEY_MAP = {
    ArrowUp: {x: 0, y: -1}, ArrowDown: {x: 0, y: 1},
    ArrowLeft: {x: -1, y: 0}, ArrowRight: {x: 1, y: 0},
    w: {x: 0, y: -1}, s: {x: 0, y: 1},
    a: {x: -1, y: 0}, d: {x: 1, y: 0},
    W: {x: 0, y: -1}, S: {x: 0, y: 1},
    A: {x: -1, y: 0}, D: {x: 1, y: 0},
  };

  document.addEventListener('keydown', (e) => {
    if (!started) {
      started = true;
      overlay.style.display = 'none';
      return;
    }
    if (!alive) {
      reset();
      return;
    }
    const nd = KEY_MAP[e.key];
    if (nd && (nd.x + dir.x !== 0 || nd.y + dir.y !== 0)) {
      nextDir = nd;
    }
  });

  function update() {
    dir = nextDir;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      return gameOver();
    }
    for (const seg of snake) {
      if (seg.x === head.x && seg.y === head.y) return gameOver();
    }

    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = `SCORE: ${score}`;
      spawnFood();
    } else {
      snake.pop();
    }
  }

  function gameOver() {
    alive = false;
    titleEl.textContent = 'GAME OVER';
    promptEl.textContent = `SCORE: ${score} — PRESS ANY KEY`;
    overlay.style.display = 'flex';
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.shadowColor = '#f0f';
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#f0f';
    ctx.fillRect(food.x * CELL + 2, food.y * CELL + 2, CELL - 4, CELL - 4);

    ctx.shadowColor = '#0ff';
    ctx.shadowBlur = 8;
    snake.forEach((seg, i) => {
      const alpha = 1 - (i / snake.length) * 0.6;
      ctx.fillStyle = `rgba(0, 255, 255, ${alpha})`;
      ctx.fillRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2);
    });
    ctx.shadowBlur = 0;
  }

  function loop(ts) {
    requestAnimationFrame(loop);
    if (!started || !alive) { draw(); return; }
    if (ts - lastTick >= TICK_MS) {
      lastTick = ts;
      update();
    }
    draw();
  }

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
